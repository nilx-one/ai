[package]
name = "nilx-one-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/nilx-one/ai"

[lib]
path = "src/lib.rs"

[dependencies]
# Pinned to the foundation commit the v0.2.0 release tag names, so this crate and the
# `@aiaiaiai/webllm` / `@aiaiaiai/contracts` packages nilx-one/web installs are one
# release. Becomes `tag = "v0.2.0"` once that tag is pushed (nilx-one/ai#17).
aiai-runtime = { git = "https://github.com/aiaiaiai-org/artificial-intelligence.git", rev = "b12f421c68bcb5843cbcb5236628161a505dd74f" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
