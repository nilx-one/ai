[package]
name = "nilx-one-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/nilx-one/ai"

[lib]
path = "src/lib.rs"

[dependencies]
# Pinned to the foundation's v0.2.0 release, the same release that published the
# `@aiaiaiai/webllm` / `@aiaiaiai/contracts` packages nilx-one/web installs.
aiai-runtime = { git = "https://github.com/aiaiaiai-org/artificial-intelligence.git", tag = "v0.2.0" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
