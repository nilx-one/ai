[package]
name = "nilx-one-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/nilx-one/ai"

[lib]
path = "src/lib.rs"

[dependencies]
# Pinned to the foundation revision that introduced canonical failure routing.
# This revision is reachable from aiaiaiai-org/artificial-intelligence master.
aiai-runtime = { git = "https://github.com/aiaiaiai-org/artificial-intelligence.git", rev = "cc98bf9e47fd88e37c0ed29201262c592a16f2d2" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
